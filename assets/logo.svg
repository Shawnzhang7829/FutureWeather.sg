<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Future weather">
  <defs>
    <linearGradient id="temp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#2563eb"/>
      <stop offset="38%" stop-color="#14b8a6"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <clipPath id="island">
      <path d="M6,36 C6,28 14,23 24,22 C32,21.2 41,19.5 50,23 C57,25.8 59,31 55,36
               C51,41 41,44 30,44 C20,44 6,43 6,36 Z"/>
    </clipPath>
  </defs>

  <!-- island filled with temperature gradient -->
  <g clip-path="url(#island)">
    <rect x="0" y="0" width="64" height="64" fill="url(#temp)"/>
    <!-- subzone subdivision lines -->
    <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="1">
      <path d="M22,18 L18,46"/><path d="M33,17 L31,46"/><path d="M44,18 L46,45"/>
      <path d="M6,30 L58,28"/><path d="M6,37 L58,38"/>
    </g>
  </g>
  <!-- island outline -->
  <path d="M6,36 C6,28 14,23 24,22 C32,21.2 41,19.5 50,23 C57,25.8 59,31 55,36
           C51,41 41,44 30,44 C20,44 6,43 6,36 Z"
        fill="none" stroke="#e6edf3" stroke-width="1.6" stroke-linejoin="round"/>
</svg>
